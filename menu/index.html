    <!-- Cross-page cross-fade (home ↔ /menu/). Declared inline so the opt-in
         exists at the instant the new page is revealed; in a stylesheet loaded
         later, Chrome finds no opt-in and aborts the transition with an error.
         The script swallows the promise rejections of any transition that is
         legitimately skipped (hidden tab, a second click mid-fade): a skipped
         fade is a normal page load, not a failure. -->
    <style>
      @view-transition { navigation: auto; }
      @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
    </style>
    <script>
      (function () {
        function settle(vt) {
          if (!vt) return;
          [vt.ready, vt.finished, vt.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); });
        }
        addEventListener('pageswap', function (e) { settle(e.viewTransition); });
        addEventListener('pagereveal', function (e) { settle(e.viewTransition); });
      })();
    </script>
